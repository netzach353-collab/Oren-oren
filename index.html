<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שידוכי אחינו</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f7f3ed;
  color: #29251f;
}

header {
  background: linear-gradient(135deg, #47321f, #987044);
  color: white;
  text-align: center;
  padding: 30px 15px;
}

header h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

header p {
  font-size: 15px;
  opacity: 0.9;
}

.container {
  max-width: 950px;
  margin: auto;
  padding: 20px 14px;
}

.search {
  width: 100%;
  padding: 14px;
  border: 1px solid #ded4c7;
  border-radius: 12px;
  font-size: 16px;
  margin-bottom: 20px;
  background: white;
}

.profiles {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

.profile {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 15px #0000000c;
  border: 1px solid #eee5da;
  text-align: center;
  padding-bottom: 18px;
}

.profile img {
  display: block;
  width: 100%;
  height: 210px;
  object-fit: cover;
  background: #e7dfd4;
}

.profile h2 {
  font-size: 19px;
  margin: 15px 5px 8px;
}

.profile p {
  color: #777064;
  font-size: 14px;
  margin-bottom: 15px;
}

.profile button {
  background: #8a633b;
  color: white;
  border: none;
  padding: 11px 18px;
  border-radius: 9px;
  font-size: 15px;
  cursor: pointer;
}

.profile button:active {
  transform: scale(0.97);
}

.empty {
  display: none;
  text-align: center;
  padding: 30px;
  color: #777;
}

footer {
  text-align: center;
  color: #84796b;
  font-size: 13px;
  padding: 25px 10px;
}

@media (min-width: 650px) {
  .profiles {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 360px) {
  .profile img {
    height: 160px;
  }

  .profile h2 {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<header>
  <h1>💍 שידוכי אחינו</h1>
  <p>מכירים, מתחברים ומוצאים את הזיווג המתאים</p>
</header>

<main class="container">

  <input
    class="search"
    id="search"
    type="search"
    placeholder="🔎 חיפוש פרופילים..."
    aria-label="חיפוש פרופילים"
  >

  <div class="profiles" id="profiles"></div>

  <div class="empty" id="empty">
    לא נמצאו פרופילים.
  </div>

</main>

<footer>
  שידוכי אחינו ❤️
</footer>

<script>
const profilesContainer = document.getElementById("profiles");
const searchInput = document.getElementById("search");
const emptyMessage = document.getElementById("empty");

// כל הפרופילים משתמשים באותה תמונה מקומית.
const photo = "20261016_163405.jpg";

// מספר הפרופילים שיוצגו
const profileCount = 12;

for (let i = 0; i < profileCount; i++) {
  const card = document.createElement("article");
  card.className = "profile";
  card.dataset.name = "אורן מולכו אחינו";

  card.innerHTML = `
    <img src="${photo}" alt="תמונת פרופיל">
    <h2>אורן מולכו אחינו</h2>
    <p>💍 פרופיל שידוכים</p>
    <button type="button">לצפייה בפרופיל</button>
  `;

  card.querySelector("button").addEventListener("click", () => {
    alert("אורן מולכו אחינו");
  });

  profilesContainer.appendChild(card);
}

searchInput.addEventListener("input", () => {
  const query = searchInput.value.trim();
  let visible = 0;

  document.querySelectorAll(".profile").forEach(card => {
    const matches = card.dataset.name.includes(query);
    card.style.display = matches ? "" : "none";

    if (matches) visible++;
  });

  emptyMessage.style.display = visible ? "none" : "block";
});
</script>

</body>
</html>
