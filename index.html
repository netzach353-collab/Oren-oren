
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>האתר שלי</title>

<style>
:root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --text: #172033;
  --muted: #718096;
  --border: #e5e9f2;
  --primary: #4f46e5;
  --primary-light: #eef2ff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* סרגל עליון */

.topbar {
  height: 68px;
  background: #7d2345;
  border-bottom: 1px solid #681b39;
  position: sticky;
  top: 0;
  z-index: 100;
}


.topbar-inner {
  max-width: 1100px;
  height: 100%;
  margin: auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

/* לוגו */
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 21px;
  font-weight: 800;
  white-space: nowrap;
}

.brand-icon {
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  color: #7d2345;
  background: white;
  border-radius: 12px;
}

.brand-icon svg {
  width: 23px;
  height: 23px;
}

/* ניווט */
.navigation {
  display: flex;
  align-items: center;
  gap: 5px;
}

.nav-button {
  border: 0;
  background: transparent;
  color: #596579;
  padding: 11px 15px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: .2s;
}

.nav-button:hover {
  background: #f3f5fa;
  color: var(--primary);
}

.nav-button.active {
  background: var(--primary-light);
  color: var(--primary);
}

/* פעולות */
.actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon-button {
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  background: white;
  color: #475569;
  border-radius: 12px;
  display: grid;
  place-items: center;
  
  position: relative;
}

.icon-button:hover {
  background: var(--primary-light);
  color: var(--primary);
}

.icon-button svg {
  width: 20px;
  height: 20px;
}

.notification-dot {
  position: absolute;
  width: 8px;
  height: 8px;
  background: #ef4444;
  border: 2px solid white;
  border-radius: 50%;
  top: 8px;
  right: 8px;
}

.login-button {
  border: none;
  background: var(--primary);
  color: white;
  border-radius: 11px;
  padding: 12px 19px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}

.login-button:hover {
  background: #4338ca;
}

/* תוכן */
.container {
  max-width: 1100px;
  margin: 32px auto;
  padding: 0 20px;
}

.welcome {
  background: white;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 30px;
}

.welcome h1 {
  margin: 0 0 10px;
  font-size: 27px;
}

.welcome p {
  color: var(--muted);
  margin: 0;
  line-height: 1.8;
}

.content-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin-top: 20px;
}

.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 23px;
  min-height: 140px;
}

.card h3 {
  margin: 0 0 10px;
  font-size: 17px;
}

.card p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

.page-title {
  font-size: 23px;
  margin: 0 0 18px;
}

/* התאמה לנייד */
@media (max-width: 720px) {
  .topbar {
    height: 62px;
  }

  .topbar-inner {
    padding: 0 12px;
    gap: 8px;
  }

  .brand {
    font-size: 17px;
    gap: 7px;
  }

  .brand-icon {
    width: 35px;
    height: 35px;
  }

  .navigation {
    gap: 0;
  }

  .nav-button {
    padding: 10px 8px;
    font-size: 12px;
  }

  .actions {
    gap: 6px;
  }

  .icon-button {
    width: 37px;
    height: 37px;
  }

  .login-button {
    padding: 10px;
    font-size: 12px;
  }

  .content-grid {
    grid-template-columns: 1fr;
  }

  .welcome {
    padding: 23px;
  }

  .welcome h1 {
    font-size: 23px;
  }
}

@media (max-width: 390px) {
  .brand-name {
    display: none;
  }

  .nav-button {
    padding: 9px 6px;
  }
}
 
 
/* סרגל ניווט תחתון */
body {
  padding-bottom: calc(82px + env(safe-area-inset-bottom));
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  right: 0;
  left: 0;
  z-index: 200;
  background: #ffffff;
  border-top: 1px solid #e8eaf1;
  padding-bottom: env(safe-area-inset-bottom);
}

.bottom-nav-inner {
  width: 100%;
  max-width: 700px;
  height: 70px;
  margin: auto;
  padding: 4px 8px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}

.bottom-item {
  border: 0;
  background: transparent;
  color: #81879a;
  font-family: inherit;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  
  border-radius: 12px;
}

.bottom-item svg {
  width: 23px;
  height: 23px;
}

.bottom-item.active {
  color: #a8325c;
}

.bottom-item.active svg {
  stroke-width: 2.2;
}

.bottom-item:active {
  background: #fbeaf0;
}

 /* עמוד ההחלקה */
/* ===== מסך החלקה נקי ===== */
.swipe-screen {
  width: 100%;
  max-width: 460px;
  margin: 0 auto;
}

.swipe-stage {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 0;
  max-height: none;
  margin: 0 auto;
  perspective: 1000px;
}

.swipe-card {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 24px;
  background: #7d2345;
  box-shadow: 0 15px 38px rgba(23, 32, 51, .16);
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
  isolation: isolate;
  transform: translateX(0) rotate(0);
  opacity: 1;
  transition: transform .32s ease, opacity .32s ease;
}

.swipe-card.dragging {
  transition: none;
  cursor: grabbing;
}

.swipe-card.swipe-out-left {
  transform: translateX(-125%) rotate(-16deg);
  opacity: 0;
}

.swipe-card.swipe-out-right {
  transform: translateX(125%) rotate(16deg);
  opacity: 0;
}

/* תמונת פרופיל */
.swipe-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 35%;
  pointer-events: none;
  -webkit-user-drag: none;
}

/* הצללה מאחורי פרטי הפרופיל */
.swipe-card.profile-card::after {
  content: "";
  position: absolute;
  z-index: 1;
  inset: 0;
  background: linear-gradient(
    to bottom,
    transparent 35%,
    rgba(0, 0, 0, .12) 48%,
    rgba(0, 0, 0, .78) 76%,
    rgba(0, 0, 0, .92) 100%
  );
  pointer-events: none;
}

.swipe-details {
  position: absolute;
  z-index: 2;
  right: 0;
  left: 0;
  bottom: 0;
  padding: 26px 22px 24px;
  color: white;
  pointer-events: none;
}

.swipe-name {
  font-size: 30px;
  font-weight: 800;
  line-height: 1.25;
  margin-bottom: 9px;
  color: white;
}

.swipe-meta {
  font-size: 14px;
  line-height: 1.8;
  color: rgba(255,255,255,.94);
  margin-bottom: 10px;
}

.swipe-bio {
  font-size: 14px;
  line-height: 1.75;
  color: rgba(255,255,255,.96);
  overflow-wrap: anywhere;
}

/* חותמת בזמן גרירה */
.swipe-stamp {
  position: absolute;
  z-index: 4;
  top: 28px;
  padding: 9px 14px;
  border: 3px solid white;
  border-radius: 10px;
  font-size: 19px;
  font-weight: 900;
  color: white;
  opacity: 0;
  pointer-events: none;
}

.swipe-stamp.like {
  left: 78px;
  transform: rotate(-10deg);
}

.swipe-stamp.pass {
  right: 70px;
  transform: rotate(10deg);
}

/* כרטיס ההדרכה הראשון */
.swipe-card.instruction-card {
  background:
    radial-gradient(ellipse at 85% 15%, rgba(255,255,255,.15), transparent 42%),
    linear-gradient(145deg, #8c3154 0%, #70203f 55%, #4b172e 100%);
  color: white;
}

.instruction-content {
  position: absolute;
  inset: 0;
  padding: 32px 25px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: none;
}

.instruction-mark {
  width: 74px;
  height: 74px;
  border-radius: 24px;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.13);
  border: 1px solid rgba(255,255,255,.24);
  margin-bottom: 26px;
}

.instruction-mark svg {
  width: 39px;
  height: 39px;
}

.instruction-content h2 {
  font-size: 30px;
  line-height: 1.3;
  margin: 0 0 12px;
  color: white;
}

.instruction-content > p {
  max-width: 290px;
  font-size: 15px;
  line-height: 1.8;
  margin: 0;
  color: rgba(255,255,255,.85);
}

.instruction-directions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  margin-top: 32px;
}

.instruction-direction {
  padding: 18px 9px;
  border: 1px solid rgba(255,255,255,.24);
  border-radius: 17px;
  background: rgba(255,255,255,.09);
}

.instruction-direction svg {
  display: block;
  width: 27px;
  height: 27px;
  margin: 0 auto 10px;
}

.instruction-direction strong {
  display: block;
  font-size: 15px;
  margin-bottom: 5px;
  color: white;
}

.instruction-direction span {
  font-size: 12px;
  color: rgba(255,255,255,.8);
}

.instruction-footer {
  margin-top: 29px;
  display: flex;
  align-items: center;
  gap: 9px;
  color: rgba(255,255,255,.82);
  font-size: 12px;
}

.instruction-footer svg {
  width: 19px;
  height: 19px;
}

@media (max-width: 480px) {
  .swipe-screen {
    margin-top: 0;
  }

  .swipe-stage {
    height: min(76dvh, 690px);
    min-height: 430px;
  }

  .swipe-card {
    border-radius: 21px;
  }

  .swipe-details {
    padding: 22px 18px;
  }

  .swipe-name {
    font-size: 28px;
  }

  .instruction-content {
    padding: 25px 19px;
  }

  .instruction-content h2 {
    font-size: 27px;
  }

  .instruction-directions {
    gap: 9px;
    margin-top: 25px;
  }
}
/* ===== כל הפרופילים ===== */
.profiles-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.profiles-toolbar h2 {
  margin: 0;
  font-size: 23px;
  color: var(--text);
}

.profiles-count {
  color: var(--muted);
  font-size: 13px;
  margin-top: 5px;
}

.filter-toggle,
.profile-interest-btn,
.filter-apply,
.filter-reset {
  border: 0;
  border-radius: 11px;
  padding: 11px 15px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.filter-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  white-space: nowrap;
}

.filter-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 18px;
  box-shadow: 0 5px 18px #17203308;
}

.filter-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.filter-field label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}

.filter-field input,
.filter-field select {
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  padding: 11px 9px;
  border-radius: 10px;
  font: inherit;
  outline: none;
}

.filter-field input:focus,
.filter-field select:focus {
  border-color: var(--primary);
}

.filter-actions {
  display: flex;
  gap: 9px;
  margin-top: 15px;
}

.filter-apply {
  background: var(--primary);
  color: white;
  flex: 1;
}

.filter-reset {
  background: var(--primary-light);
  color: var(--primary);
}

.profiles-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.profile-tile {
  min-width: 0;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
}

.profile-tile:active {
  transform: scale(.985);
}

.profile-tile img {
  display: block;
  width: 100%;
  height: 185px;
  object-fit: cover;
  background: var(--primary-light);
}

.profile-tile-info {
  padding: 11px;
}

.profile-tile-name {
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
  overflow-wrap: anywhere;
}

.profile-tile-meta {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

.profile-tile-about {
  color: var(--text);
  font-size: 12px;
  line-height: 1.5;
  margin-top: 8px;
  min-height: 36px;
  overflow-wrap: anywhere;
}

.profile-tile-open {
  display: block;
  margin-top: 10px;
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
}

.profile-detail {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
}

.profile-detail-photo {
  width: 100%;
  height: min(55vh, 390px);
  object-fit: cover;
  display: block;
  background: var(--primary-light);
}

.profile-detail-body {
  padding: 20px;
}

.profile-detail-body h2 {
  margin: 0 0 7px;
  font-size: 25px;
}

.profile-detail-meta {
  color: var(--muted);
  margin-bottom: 18px;
}

.profile-detail-section {
  padding: 13px 0;
  border-top: 1px solid var(--border);
}

.profile-detail-section h3 {
  font-size: 14px;
  margin: 0 0 7px;
}

.profile-detail-section p {
  color: var(--muted);
  margin: 0;
  line-height: 1.7;
  white-space: pre-wrap;
}

.profile-detail-actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.profile-interest-btn {
  background: var(--primary);
  color: white;
  flex: 1;
}

.profile-back-btn {
  background: var(--primary-light);
  color: var(--primary);
  border: 0;
  border-radius: 11px;
  padding: 11px 15px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.profiles-empty {
  grid-column: 1 / -1;
  padding: 35px 16px;
  text-align: center;
  color: var(--muted);
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: 16px;
}

@media (max-width: 380px) {
  .profiles-grid {
    gap: 9px;
  }

  .profile-tile img {
    height: 145px;
  }

  .profile-tile-info {
    padding: 9px;
  }

  .profile-tile-name {
    font-size: 14px;
  }

  .profiles-toolbar h2 {
    font-size: 20px;
  }
}
 
 /* מסך החלקה בגובה מלא בין הסרגלים */
body:has(.swipe-screen) {
  overflow-x: hidden;
}

body:has(.swipe-screen) #app-content {
  height: calc(
    100dvh
    - 56px
    - 68px
    - env(safe-area-inset-bottom, 0px)
  );
  min-height: 0;
  margin-top: 0;
  margin-bottom: 0;
  padding: 10px 12px;
  box-sizing: border-box;
}

.swipe-screen {
  width: 100%;
  max-width: 460px;
  height: 100%;
  margin: 0 auto;
}

.swipe-stage {
  height: 100%;
}

.swipe-card {
  inset: 0;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
}

@media (min-width: 721px) {
  .swipe-card {
    height: 100%;
  }
}

/* ===== עמוד הפרטים שלי ===== */

.personal-page {
  max-width: 760px;
  margin: 0 auto;
}

.personal-heading {
  margin-bottom: 22px;
}

.personal-heading h1 {
  margin: 0 0 7px;
  font-size: 26px;
  color: #4b1930;
}

.personal-heading p {
  margin: 0;
  color: #718096;
  font-size: 14px;
  line-height: 1.7;
}

.personal-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 6px;
  background: #f3e8ec;
  border: 1px solid #ead5de;
  border-radius: 14px;
  margin-bottom: 20px;
}

.personal-tab {
  border: 0;
  border-radius: 10px;
  padding: 13px 8px;
  background: transparent;
  color: #7d2345;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.personal-tab.active {
  color: #fff;
  background: #7d2345;
  box-shadow: 0 3px 8px #7d234526;
}

.personal-panel {
  background: #fff;
  border: 1px solid #e5e9f2;
  border-radius: 17px;
  padding: 20px;
  margin-bottom: 16px;
}

.personal-panel-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.personal-panel-title h2 {
  margin: 0;
  color: #4b1930;
  font-size: 18px;
}

.personal-panel-title p {
  margin: 5px 0 0;
  color: #718096;
  font-size: 13px;
  line-height: 1.6;
}

.personal-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 15px 0;
  border-bottom: 1px solid #f0e7eb;
}

.personal-field:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}

.personal-field-info {
  min-width: 0;
  flex: 1;
}

.personal-field-label {
  display: block;
  color: #718096;
  font-size: 12px;
  margin-bottom: 6px;
}

.personal-field-value {
  color: #4b1930;
  font-size: 15px;
  font-weight: 700;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.personal-edit-btn {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 38px;
  padding: 9px 12px;
  border: 1px solid #ead5de;
  border-radius: 10px;
  background: #f3e8ec;
  color: #7d2345;
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.personal-edit-btn svg {
  width: 16px;
  height: 16px;
}

.personal-edit-btn:hover {
  background: #ead5de;
}

.personal-input {
  display: block;
  width: 100%;
  margin-top: 9px;
  padding: 12px;
  border: 1px solid #e5c8d4;
  border-radius: 10px;
  background: #fffafb;
  color: #4b1930;
  font: inherit;
  font-size: 14px;
  outline: none;
}

.personal-input:focus {
  border-color: #7d2345;
  box-shadow: 0 0 0 3px #7d234514;
}

.personal-save-btn {
  width: 100%;
  margin-top: 12px;
  padding: 13px;
  border: 0;
  border-radius: 11px;
  background: #7d2345;
  color: #fff;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.personal-save-btn:hover {
  background: #681b39;
}

.personal-cancel-btn {
  width: 100%;
  margin-top: 8px;
  padding: 11px;
  border: 1px solid #ead5de;
  border-radius: 11px;
  background: #f3e8ec;
  color: #7d2345;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.personal-privacy-row {
  padding: 16px 0;
  border-bottom: 1px solid #f0e7eb;
}

.personal-privacy-row:last-child {
  border-bottom: 0;
}

.personal-privacy-top {

function isFullPrivacyMode() {
  return localStorage.getItem(PERSONAL_PRIVACY_MODE_KEY) === 'yes';
}

function toggleFullPrivacyMode() {
  const enable = !isFullPrivacyMode();

  if (enable) {
    localStorage.setItem(PERSONAL_PRIVACY_MODE_KEY, 'yes');

    const privacy = getPersonalPrivacy();

    Object.keys(personalFieldLabels).forEach(key => {

      }
    });

    savePersonalPrivacy(privacy);
  } else {
    localStorage.setItem(PERSONAL_PRIVACY_MODE_KEY, 'no');
  }

  renderPersonal();
}

(function () {
  const bottomNav = document.querySelector('.bottom-nav');

  if (!bottomNav || !window.visualViewport) return;

  let keyboardWasOpen = false;
  
  function detectKeyboard() {
    const viewport = window.visualViewport;

    // זיהוי פתיחת מקלדת לפי צמצום גובה אזור התצוגה
    const keyboardOpen =
      window.innerHeight - viewport.height > 150;

    // מסתירים את הסרגל רק כשהמיקוד נמצא בשדה עריכה
    const activeElement = document.activeElement;
    const editingField = activeElement &&
      activeElement.matches(
        'input, textarea, select, [contenteditable="true"]'
      );

    const shouldHide = keyboardOpen && editingField;

    document.body.classList.toggle('keyboard-open', shouldHide);
    keyboardWasOpen = shouldHide;
  }

  window.visualViewport.addEventListener('resize', detectKeyboard);
  window.visualViewport.addEventListener('scroll', detectKeyboard);

  document.addEventListener('focusin', detectKeyboard);

  document.addEventListener('focusout', function () {
    // מאפשר לדפדפן לעדכן את המיקוד לפני הבדיקה מחדש
    setTimeout(detectKeyboard, 100);
  });

  window.addEventListener('resize', detectKeyboard);
})();
function bottomNavigate(name, button) {
  document.querySelectorAll('.bottom-item').forEach(item => {
    item.classList.remove('active');

  showPage(name);
}

    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[char]));
}

function getProfileById(id) {

function getProfileName(profile) {

function sendProfileInterest(id) {
  const profile = getProfileById(id);
  if (!profile) return;

  const sent = readMatchData('lev_sent_interests', []);
  const alreadySent = sent.some(item => String(item.profileId) === String(id));

  if (!alreadySent) {
    sent.push({
      profileId: id,
      status: 'pending',
      createdAt: new Date().toISOString()
    });

    saveMatchData('lev_sent_interests', sent);
  }

  openProfileDetail(id);
}

function readMatchData(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch (error) {
    return fallback;
  }
}

function saveMatchData(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

let swipeStartX = null;
let swipeStartY = null;
let swipePointerElement = null;
let swipePointerId = null;
let swipeCurrentX = 0;
let swipeCurrentY = 0;

function swipePointerDown(event) {
  if (event.pointerType === "mouse" && event.button !== 0) return;

  const element = event.currentTarget;

  swipeStartX = event.clientX;
  swipeStartY = event.clientY;
  swipeCurrentX = 0;
  swipeCurrentY = 0;
  swipePointerElement = element;
  swipePointerId = event.pointerId;

  element.classList.add("dragging");

  try {
    element.setPointerCapture(event.pointerId);
  } catch (error) {}
}

function swipePointerMove(event) {
  const element = event.currentTarget;

  if (
    swipePointerElement !== element ||
    swipeStartX === null
  ) return;

  swipeCurrentX = event.clientX - swipeStartX;
  swipeCurrentY = event.clientY - swipeStartY;

  if (Math.abs(swipeCurrentX) > Math.abs(swipeCurrentY)) {
    element.style.transform =
      `translate(${swipeCurrentX}px, ${swipeCurrentY * 0.25}px) rotate(${swipeCurrentX * 0.045}deg)`;
  }

  const likeStamp = element.querySelector(".swipe-stamp.like");
  const passStamp = element.querySelector(".swipe-stamp.pass");

  if (likeStamp) {
    likeStamp.style.opacity = swipeCurrentX < -20
      ? Math.min(1, Math.abs(swipeCurrentX) / 100)
      : 0;
  }

  if (passStamp) {
    passStamp.style.opacity = swipeCurrentX > 20
      ? Math.min(1, swipeCurrentX / 100)
      : 0;
  }
}

function swipePointerUp(event) {
  const element = event.currentTarget;

  if (
    swipePointerElement !== element ||
    swipeStartX === null
  ) return;

  const deltaX = event.clientX - swipeStartX;
  const deltaY = event.clientY - swipeStartY;
  const cardType = element.dataset.cardType;
  const profileId = element.dataset.profileId;

  element.classList.remove("dragging");

  const shouldSwipe =
    Math.abs(deltaX) >= 90 &&
    Math.abs(deltaX) > Math.abs(deltaY) * 1.15;

  swipeStartX = null;
  swipeStartY = null;
  swipePointerElement = null;
  swipePointerId = null;
  swipeCurrentX = 0;
  swipeCurrentY = 0;

  if (!shouldSwipe) {
    element.style.transform = "";
    const likeStamp = element.querySelector(".swipe-stamp.like");
    const passStamp = element.querySelector(".swipe-stamp.pass");
    if (likeStamp) likeStamp.style.opacity = 0;
    if (passStamp) passStamp.style.opacity = 0;
    return;
  }

  const direction = deltaX < 0 ? "left" : "right";

  element.classList.add(
    direction === "left" ? "swipe-out-left" : "swipe-out-right"
  );

  if (cardType === "intro") {
    localStorage.setItem("lev_swipe_intro_seen", "yes");
    setTimeout(() => renderSwipe(), 260);
    return;
  }

  if (profileId) {
    setTimeout(() => {
      recordSwipe(
        profileId,
        direction === "left" ? "interested" : "no"
      );
    }, 180);
  }
}

function swipePointerCancel() {
  if (swipePointerElement) {
    swipePointerElement.classList.remove("dragging");
    swipePointerElement.style.transform = "";

    const likeStamp = swipePointerElement.querySelector(".swipe-stamp.like");
    const passStamp = swipePointerElement.querySelector(".swipe-stamp.pass");

    if (likeStamp) likeStamp.style.opacity = 0;
    if (passStamp) passStamp.style.opacity = 0;
  }

  swipeStartX = null;
  swipeStartY = null;
  swipePointerElement = null;
  swipePointerId = null;
  swipeCurrentX = 0;
  swipeCurrentY = 0;
}

function recordSwipe(profileId, decision) {
  const decisions = readMatchData("lev_interest_decisions", []);

  if (decisions.some(item => item.profileId === profileId)) {
    renderSwipe();
    return;
  }

  decisions.push({
    profileId,
    decision,
    date: new Date().toISOString()
  });

  saveMatchData("lev_interest_decisions", decisions);

  if (decision === "interested") {
    const sent = readMatchData("lev_sent_interests", []);

    if (!sent.some(item => item.profileId === profileId)) {
      sent.push({
        profileId,
        date: new Date().toISOString(),
        status: "pending"
      });

      saveMatchData("lev_sent_interests", sent);
    }
  }

  renderSwipe();
}

function resetSwipeProfiles() {
  localStorage.removeItem("lev_interest_decisions");
  renderSwipe();
}
 
 
 
/* ===== פרטים אישיים והגדרות פרטיות ===== */

const PERSONAL_KEY = 'lev_personal_details';
const PERSONAL_PRIVACY_KEY = 'lev_personal_privacy';

const personalDefaultDetails = {
  name: '',
  age: '',
  city: '',
  occupation: '',
  status: '',
  about: '',
  interests: ''
};

const personalFieldLabels = {
  name: 'שם',
  age: 'גיל',
  city: 'עיר מגורים',
  occupation: 'עיסוק',
  status: 'מצב אישי',
  about: 'קצת עליי',
  interests: 'תחומי עניין'
};

function getPersonalDetails() {
  const saved = readMatchData(PERSONAL_KEY, {});
  return { ...personalDefaultDetails, ...saved };
}

function savePersonalDetails(details) {
  saveMatchData(PERSONAL_KEY, details);
}

function getPersonalPrivacy() {
  const saved = readMatchData(PERSONAL_PRIVACY_KEY, {});
  const privacy = {};

  Object.keys(personalFieldLabels).forEach(key => {
    privacy[key] = saved[key] || 'public';
  });

  return privacy;
}

function savePersonalPrivacy(privacy) {
  saveMatchData(PERSONAL_PRIVACY_KEY, privacy);
}

let personalActiveTab = 'details';
let personalEditingField = '';

function renderPersonal() {
  const content = document.getElementById('app-content');
  if (!content) return;

  const details = getPersonalDetails();

  content.innerHTML = `
    <section class="personal-page">
     

      <div class="personal-tabs">
        <button type="button"
          class="personal-tab ${personalActiveTab === 'details' ? 'active' : ''}"
          onclick="switchPersonalTab('details')">
          הפרטים שלי
        </button>

       
<button type="button"
  class="personal-tab ${personalActiveTab === 'privacy' ? 'active' : ''}"
  onclick="switchPersonalTab('privacy')">

  <svg class="personal-tab-icon"
    viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true">
    <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/>
    <path d="m9 12 2 2 4-4"/>
  </svg>

  הגדרות פרטיות
</button>

      </div>

      <div id="personal-tab-content">
        ${personalActiveTab === 'details'
          ? renderPersonalDetails(details)
          : renderPersonalPrivacy()}
      </div>
    </section>
  `;
}

function switchPersonalTab(tab) {
  personalActiveTab = tab;
  personalEditingField = '';
  renderPersonal();
}

function renderPersonalDetails(details) {
  const fields = Object.keys(personalFieldLabels);

  return `
    <section class="personal-panel">
      <div class="personal-panel-title">
        <div>
          <h2>הפרטים שלך</h2>
          <p>אפשר לערוך כל פרט בנפרד.</p>
        </div>
      </div>

      ${fields.map(key => {
        const value = details[key] || '';
        const editing = personalEditingField === key;

        return `
          <div class="personal-field">
            <div class="personal-field-info">
              <span class="personal-field-label">
                ${escapeHTML(personalFieldLabels[key])}
              </span>

              ${editing ? `
                <input
                  class="personal-input"
                  id="personal-edit-input"
                  data-field="${key}"
                  value="${escapeHTML(value)}"
                  placeholder="הזן ${escapeHTML(personalFieldLabels[key])}"
                  ${key === 'age' ? 'type="number" min="18" max="120"' : ''}
                  ${key === 'about' || key === 'interests'
                    ? 'style="min-height:80px"'
                    : ''}>
                <button type="button"
                  class="personal-save-btn"
                  onclick="savePersonalField('${key}')">
                  שמירת השינוי
                </button>
                <button type="button"
                  class="personal-cancel-btn"
                  onclick="cancelPersonalEdit()">
                  ביטול
                </button>
              ` : `
                <div class="personal-field-value">
                  ${escapeHTML(value || 'לא הוזן עדיין')}
                </div>
              `}
            </div>

            ${!editing ? `
              <button type="button"
                class="personal-edit-btn"
                onclick="editPersonalField('${key}')"
                aria-label="עריכת ${escapeHTML(personalFieldLabels[key])}">
                <svg viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="m15 5 4 4"/>
                  <path d="M4 20l4.5-1 10-10a2.8 2.8 0 0 0-4-4l-10 10L4 20Z"/>
                </svg>
                עריכה
              </button>
            ` : ''}
          </div>
        `;
      }).join('')}
    </section>
  `;
}

function editPersonalField(key) {
  if (!Object.prototype.hasOwnProperty.call(personalFieldLabels, key)) return;
  personalEditingField = key;
  renderPersonal();

  const input = document.getElementById('personal-edit-input');
  if (input) input.focus();
}

function savePersonalField(key) {
  if (!Object.prototype.hasOwnProperty.call(personalFieldLabels, key)) return;

  const input = document.getElementById('personal-edit-input');
  if (!input) return;

  const details = getPersonalDetails();
  let value = input.value.trim();

  if (key === 'age' && value !== '') {
    const age = Number(value);

    if (!Number.isInteger(age) || age < 18 || age > 120) {
      alert('יש להזין גיל בין 18 ל־120.');
      return;
    }

    value = String(age);
  }

  details[key] = value;
  savePersonalDetails(details);

  personalEditingField = '';
  renderPersonal();
}

function cancelPersonalEdit() {
  personalEditingField = '';
  renderPersonal();
}

function renderPersonalPrivacy() {
  const privacy = getPersonalPrivacy();

  return `
    <section class="personal-panel">
<div class="personal-privacy-mode">
  <div>
    <h3>מצב פרטיות מלא</h3>
   <p>
  רק שם המשתמש ותמונות הפרופיל יהיו גלויים לאחרים.
  שאר הפרטים ייחשפו רק לאחר שתיווצר התאמה הדדית.
</p>
  </div>

 
<button
  type="button"
  role="switch"
  aria-checked="${isFullPrivacyMode()}"
  aria-label="מצב פרטיות מלא"
  class="privacy-mode-button ${isFullPrivacyMode() ? 'active' : ''}"
  onclick="toggleFullPrivacyMode()">
</button>

</div>
     
      ${Object.keys(personalFieldLabels).map(key => `
        <div class="personal-privacy-row">
          <div class="personal-privacy-top">
            <div>
              <div class="personal-privacy-name">
                ${escapeHTML(personalFieldLabels[key])}
              </div>
              <div class="personal-privacy-description">
                ${privacy[key] === 'public'
                  ? 'מוגדר להצגה בפרופיל הרגיל.'
                  : privacy[key] === 'matched'
                    ? 'מיועד להצגה רק לאחר התאמה הדדית.'
                    : 'מוגדר כפרט פרטי.'}
              </div>
            </div>
          </div>

          <select class="personal-privacy-select"
            onchange="updatePersonalPrivacy('${key}', this.value)">
            <option value="public" ${privacy[key] === 'public' ? 'selected' : ''}>
              גלוי לכולם
            </option>
            <option value="matched" ${privacy[key] === 'matched' ? 'selected' : ''}>
        לחשוף להתאמות
            </option>
            <option value="private" ${privacy[key] === 'private' ? 'selected' : ''}>
              פרטי — רק אני
            </option>
          </select>
        </div>
      `).join('')}
    </section>
  `;
}

function updatePersonalPrivacy(key, value) {
  if (!Object.prototype.hasOwnProperty.call(personalFieldLabels, key)) return;
  if (!['public', 'matched', 'private'].includes(value)) return;

  const privacy = getPersonalPrivacy();
  privacy[key] = value;
  savePersonalPrivacy(privacy);

  renderPersonal();
}
