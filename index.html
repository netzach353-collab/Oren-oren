<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>האתר שלי</title>

<style>
  :root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --text: #172033;
  --muted: #718096;
  --border: #e5e9f2;
  --primary: #4f46e5;
  --primary-light: #eef2ff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* סרגל עליון */

.topbar {
  height: 68px;
  background: #7d2345;
  border-bottom: 1px solid #681b39;
  position: sticky;
  top: 0;
  z-index: 100;
}


.topbar-inner {
  max-width: 1100px;
  height: 100%;
  margin: auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

/* לוגו */
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 21px;
  font-weight: 800;
  white-space: nowrap;
}

.brand-icon {
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  color: #7d2345;
  background: white;
  border-radius: 12px;
}

.brand-icon svg {
  width: 23px;
  height: 23px;
}

/* ניווט */






.nav-button.active {
  background: var(--primary-light);
  color: var(--primary);
}

/* פעולות */


.icon-button {
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  background: white;
  color: #475569;
  border-radius: 12px;
  display: grid;
  place-items: center;
  
  position: relative;
}

.icon-button:hover {
  background: var(--primary-light);
  color: var(--primary);
}

.icon-button svg {
  width: 20px;
  height: 20px;
}

.notification-dot {
  position: absolute;
  width: 8px;
  height: 8px;
  background: #ef4444;
  border: 2px solid white;
  border-radius: 50%;
  top: 8px;
  right: 8px;
}

/* תוכן */
.container {
  max-width: 1100px;
  margin: 32px auto;
  padding: 0 20px;
}

















/* התאמה לנייד */
@media (max-width: 720px) {
  .topbar {
    height: 62px;
  }

  .topbar-inner {
    padding: 0 12px;
    gap: 8px;
  }

  .brand {
    font-size: 17px;
    gap: 7px;
  }

  .brand-icon {
    width: 35px;
    height: 35px;
  }

  

  

  

  .icon-button {
    width: 37px;
    height: 37px;
  }

  

  

  

  
}


 
 
/* סרגל ניווט תחתון */
body {
  padding-bottom: calc(82px + env(safe-area-inset-bottom));
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  right: 0;
  left: 0;
  z-index: 200;
  background: #ffffff;
  border-top: 1px solid #e8eaf1;
  padding-bottom: env(safe-area-inset-bottom);
}

.bottom-nav-inner {
  width: 100%;
  max-width: 700px;
  height: 70px;
  margin: auto;
  padding: 4px 8px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}

.bottom-item {
  border: 0;
  background: transparent;
  color: #81879a;
  font-family: inherit;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  
  border-radius: 12px;
}

.bottom-item svg {
  width: 23px;
  height: 23px;
}

.bottom-item.active {
  color: #a8325c;
}

.bottom-item.active svg {
  stroke-width: 2.2;
}

.bottom-item:active {
  background: #fbeaf0;
}

 /* עמוד ההחלקה */
/* ===== מסך החלקה נקי ===== */
.swipe-screen {
  width: 100%;
  max-width: 460px;
  margin: 0 auto;
}

.swipe-stage {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 0;
  max-height: none;
  margin: 0 auto;
  perspective: 1000px;
}

.swipe-card {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 24px;
  background: #7d2345;
  box-shadow: 0 15px 38px rgba(23, 32, 51, .16);
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
  isolation: isolate;
  transform: translateX(0) rotate(0);
  opacity: 1;
  transition: transform .32s ease, opacity .32s ease;
}

.swipe-card.dragging {
  transition: none;
  cursor: grabbing;
}

.swipe-card.swipe-out-left {
  transform: translateX(-125%) rotate(-16deg);
  opacity: 0;
}

.swipe-card.swipe-out-right {
  transform: translateX(125%) rotate(16deg);
  opacity: 0;
}

/* תמונת פרופיל */
.swipe-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 35%;
  pointer-events: none;
  -webkit-user-drag: none;
}

/* הצללה מאחורי פרטי הפרופיל */
.swipe-card.profile-card::after {
  content: "";
  position: absolute;
  z-index: 1;
  inset: 0;
  background: linear-gradient(
    to bottom,
    transparent 35%,
    rgba(0, 0, 0, .12) 48%,
    rgba(0, 0, 0, .78) 76%,
    rgba(0, 0, 0, .92) 100%
  );
  pointer-events: none;
}

.swipe-details {
  position: absolute;
  z-index: 2;
  right: 0;
  left: 0;
  bottom: 0;
  padding: 26px 22px 24px;
  color: white;
  pointer-events: none;
}

.swipe-name {
  font-size: 30px;
  font-weight: 800;
  line-height: 1.25;
  margin-bottom: 9px;
  color: white;
}

.swipe-meta {
  font-size: 14px;
  line-height: 1.8;
  color: rgba(255,255,255,.94);
  margin-bottom: 10px;
}

.swipe-bio {
  font-size: 14px;
  line-height: 1.75;
  color: rgba(255,255,255,.96);
  overflow-wrap: anywhere;
}

/* חותמת בזמן גרירה */
.swipe-stamp {
  position: absolute;
  z-index: 4;
  top: 28px;
  padding: 9px 14px;
  border: 3px solid white;
  border-radius: 10px;
  font-size: 19px;
  font-weight: 900;
  color: white;
  opacity: 0;
  pointer-events: none;
}

.swipe-stamp.like {
  left: 78px;
  transform: rotate(-10deg);
}

.swipe-stamp.pass {
  right: 70px;
  transform: rotate(10deg);
}

/* כרטיס ההדרכה הראשון */
.swipe-card.instruction-card {
  background:
    radial-gradient(ellipse at 85% 15%, rgba(255,255,255,.15), transparent 42%),
    linear-gradient(145deg, #8c3154 0%, #70203f 55%, #4b172e 100%);
  color: white;
}

.instruction-content {
  position: absolute;
  inset: 0;
  padding: 32px 25px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: none;
}

.instruction-mark {
  width: 74px;
  height: 74px;
  border-radius: 24px;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.13);
  border: 1px solid rgba(255,255,255,.24);
  margin-bottom: 26px;
}

.instruction-mark svg {
  width: 39px;
  height: 39px;
}

.instruction-content h2 {
  font-size: 30px;
  line-height: 1.3;
  margin: 0 0 12px;
  color: white;
}

.instruction-content > p {
  max-width: 290px;
  font-size: 15px;
  line-height: 1.8;
  margin: 0;
  color: rgba(255,255,255,.85);
}

.instruction-directions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  margin-top: 32px;
}

.instruction-direction {
  padding: 18px 9px;
  border: 1px solid rgba(255,255,255,.24);
  border-radius: 17px;
  background: rgba(255,255,255,.09);
}

.instruction-direction svg {
  display: block;
  width: 27px;
  height: 27px;
  margin: 0 auto 10px;
}

.instruction-direction strong {
  display: block;
  font-size: 15px;
  margin-bottom: 5px;
  color: white;
}

.instruction-direction span {
  font-size: 12px;
  color: rgba(255,255,255,.8);
}

.instruction-footer {
  margin-top: 29px;
  display: flex;
  align-items: center;
  gap: 9px;
  color: rgba(255,255,255,.82);
  font-size: 12px;
}

.instruction-footer svg {
  width: 19px;
  height: 19px;
}

@media (max-width: 480px) {
  .swipe-screen {
    margin-top: 0;
  }

  .swipe-stage {
    height: min(76dvh, 690px);
    min-height: 430px;
  }

  .swipe-card {
    border-radius: 21px;
  }

  .swipe-details {
    padding: 22px 18px;
  }

  .swipe-name {
    font-size: 28px;
  }

  .instruction-content {
    padding: 25px 19px;
  }

  .instruction-content h2 {
    font-size: 27px;
  }

  .instruction-directions {
    gap: 9px;
    margin-top: 25px;
  }
}
/* ===== כל הפרופילים ===== */
.profiles-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.profiles-toolbar h2 {
  margin: 0;
  font-size: 23px;
  color: var(--text);
}

.profiles-count {
  color: var(--muted);
  font-size: 13px;
  margin-top: 5px;
}

.filter-toggle,
.profile-interest-btn,
.filter-apply,
.filter-reset {
  border: 0;
  border-radius: 11px;
  padding: 11px 15px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.filter-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  white-space: nowrap;
}

.filter-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 18px;
  box-shadow: 0 5px 18px #17203308;
}

.filter-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.filter-field label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}

.filter-field input,
.filter-field select {
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  padding: 11px 9px;
  border-radius: 10px;
  font: inherit;
  outline: none;
}

.filter-field input:focus,
.filter-field select:focus {
  border-color: var(--primary);
}

.filter-actions {
  display: flex;
  gap: 9px;
  margin-top: 15px;
}

.filter-apply {
  background: var(--primary);
  color: white;
  flex: 1;
}

.filter-reset {
  background: var(--primary-light);
  color: var(--primary);
}

.profiles-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.profile-tile {
  min-width: 0;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
}

.profile-tile:active {
  transform: scale(.985);
}

.profile-tile img {
  display: block;
  width: 100%;
  height: 185px;
  object-fit: cover;
  background: var(--primary-light);
}

.profile-tile-info {
  padding: 11px;
}

.profile-tile-name {
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
  overflow-wrap: anywhere;
}

.profile-tile-meta {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

.profile-tile-about {
  color: var(--text);
  font-size: 12px;
  line-height: 1.5;
  margin-top: 8px;
  min-height: 36px;
  overflow-wrap: anywhere;
}

.profile-tile-open {
  display: block;
  margin-top: 10px;
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
}

.profile-detail {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
}

.profile-detail-photo {
  width: 100%;
  height: min(55vh, 390px);
  object-fit: cover;
  display: block;
  background: var(--primary-light);
}

.profile-detail-body {
  padding: 20px;
}

.profile-detail-body h2 {
  margin: 0 0 7px;
  font-size: 25px;
}



.profile-detail-section {
  padding: 13px 0;
  border-top: 1px solid var(--border);
}

.profile-detail-section h3 {
  font-size: 14px;
  margin: 0 0 7px;
}

.profile-detail-section p {
  color: var(--muted);
  margin: 0;
  line-height: 1.7;
  white-space: pre-wrap;
}

.profile-detail-actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.profile-interest-btn {
  background: var(--primary);
  color: white;
  flex: 1;
}

.profile-back-btn {
  background: var(--primary-light);
  color: var(--primary);
  border: 0;
  border-radius: 11px;
  padding: 11px 15px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.profiles-empty {
  grid-column: 1 / -1;
  padding: 35px 16px;
  text-align: center;
  color: var(--muted);
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: 16px;
}

@media (max-width: 380px) {
  .profiles-grid {
    gap: 9px;
  }

  .profile-tile img {
    height: 145px;
  }

  .profile-tile-info {
    padding: 9px;
  }

  .profile-tile-name {
    font-size: 14px;
  }

  .profiles-toolbar h2 {
    font-size: 20px;
  }
}
 
 /* מסך החלקה בגובה מלא בין הסרגלים */
body:has(.swipe-screen) {
  overflow-x: hidden;
}

body:has(.swipe-screen) #app-content {
  height: calc(
    100dvh
    - 56px
    - 68px
    - env(safe-area-inset-bottom, 0px)
  );
  min-height: 0;
  margin-top: 0;
  margin-bottom: 0;
  padding: 10px 12px;
  box-sizing: border-box;
}

.swipe-screen {
  width: 100%;
  max-width: 460px;
  height: 100%;
  margin: 0 auto;
}

.swipe-stage {
  height: 100%;
}

.swipe-card {
  inset: 0;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
}

@media (min-width: 721px) {
  .swipe-card {
    height: 100%;
  }
}

  }

  }

 /* הסתרת הסרגל התחתון בזמן פתיחת המקלדת */

  display: none !important;
}

/* ביטול הרווח התחתון בזמן שהמקלדת פתוחה */

 /* מצב פרטיות מלא */

/* מתג פרטיות */
.privacy-mode-button {
  position: relative;
  display: inline-block;
  flex: 0 0 48px;
  width: 48px;
  min-width: 48px;
  height: 28px;
  padding: 0;
  border: none;
  border-radius: 999px;
  background: #cbd5e1;
  cursor: pointer;
  transition: background-color .22s ease;
  -webkit-tap-highlight-color: transparent;
}

.privacy-mode-button::after {
  content: "";
  position: absolute;
  top: 3px;
  right: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
  transition: transform .22s ease;
}

.privacy-mode-button.active {
  background: #7d2345;
}

.privacy-mode-button.active::after {
  transform: translateX(-20px);
}

.privacy-mode-button:focus-visible {
  outline: 3px solid #7d234540;
  outline-offset: 3px;
}

 /* כותרת עמוד התעניינו בי */

  margin: 8px 0 20px;
  text-align: right;
}

.interested-heading h2 {
  margin: 0 0 8px;
  color: var(--text, #0f172a);
  font-size: 23px;
  font-weight: 800;
}

.interested-heading p {
  margin: 0;
  color: var(--muted, #64748b);
  font-size: 14px;

async function loginWithGoogle() {

async function afterAuthSuccess(user) {
  if (!user) {
    renderLogin();
    return;
  }
  currentUser = user; 

  const { data: profile, error } = await db
    .from('profiles')

let lockedRegisterFields = {};

function prepareRegistrationFromProfile(profile, user) {
  lockedRegisterFields = {};

  registerData.phone = (profile && profile.phone) || user.phone || '';
  registerData.email = (profile && profile.email) || user.email || '';
  registerData.name = (profile && profile.name) || '';
  registerData.gender = (profile && profile.gender) || '';
  registerData.birthDate = (profile && profile.birth_date) || '';
  registerData.city = (profile && profile.city) || '';
  registerData.occupation = (profile && profile.occupation) || '';
  registerData.status = (profile && profile.status) || '';
  registerData.children = (profile && profile.children) || '';
  registerData.religiousView = (profile && profile.religious_view) || '';
  registerData.height = (profile && profile.height) || '';
  registerData.service = (profile && profile.service) || '';
  registerData.relationshipGoal = (profile && profile.relationship_goal) || '';
  registerData.languages = (profile && Array.isArray(profile.languages)) ? profile.languages : [];
  registerData.smoker = (profile && profile.smoker) || '';
  registerData.health = (profile && profile.health) || '';
  registerData.kosher = (profile && profile.kosher) || '';
  registerData.about = (profile && profile.about) || '';

  // נועלים שדות שכבר מולאו
  Object.keys(registerData).forEach(key => {
    const val = registerData[key];
    if (Array.isArray(val) ? val.length : (val && String(val).trim() !== '')) {
      lockedRegisterFields[key] = true;
    }
  });

  // קובעים מאיזה שלב להתחיל
  if (!registerData.email) registerStep = 1;
  else if (!registerData.name || !registerData.birthDate) registerStep = 2;
  else if (!registerData.religiousView && !registerData.status) registerStep = 3;
  else registerStep = 4;
}

(function () {
  const editableSelector =
    'input, textarea, select, [contenteditable="true"]';

  function detectKeyboard() {
    const viewport = window.visualViewport;
    const active = document.activeElement;
    const editing = !!(
      active && active.matches(editableSelector)
    );

    let keyboardOpen = false;

    if (viewport && editing) {
      keyboardOpen =
        window.innerHeight - viewport.height > 120;
    }

    document.body.classList.toggle(
      'keyboard-open',
      keyboardOpen
    );
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener(
      'resize', detectKeyboard
    );
    window.visualViewport.addEventListener(
      'scroll', detectKeyboard
    );
  }

  document.addEventListener('focusin', () => {
    requestAnimationFrame(detectKeyboard);
  });

  document.addEventListener('focusout', () => {
    requestAnimationFrame(() => {
      requestAnimationFrame(detectKeyboard);
    });
  });

  window.addEventListener('resize', detectKeyboard);
  detectKeyboard();
})();

function requiredLabel(text) {
  return `${text} <span class="required-mark" aria-hidden="true">*</span>`;
}

function clearRegistrationErrors() {
  const form = document.getElementById('register-form');
  if (!form) return;

  form.querySelectorAll('.field-error').forEach(el => {
    el.classList.remove('field-error');
    el.removeAttribute('aria-invalid');
  });

  form.querySelectorAll('.has-error').forEach(el => {
    el.classList.remove('has-error');
  });

  form.querySelectorAll('.field-error-message').forEach(el => {
    el.remove();
  });

  const summary = form.querySelector('.auth-required-summary');
  if (summary) summary.classList.remove('visible');
}

function showRegistrationErrors(missingFields) {
  clearRegistrationErrors();

  const form = document.getElementById('register-form');
  if (!form) return;

  const summary = form.querySelector('.auth-required-summary');
  if (summary) summary.classList.add('visible');

  missingFields.forEach(({ name, message }) => {
    const fields = [...form.querySelectorAll('[name]')];
    const matchingFields = fields.filter(field => field.name === name);

    if (!matchingFields.length) return;

    const first = matchingFields[0];

    if (first.type === 'radio' || first.type === 'checkbox') {
      const group = first.closest('.auth-form-group');
      const choices = group?.querySelector('.auth-choice-list');

      if (choices) choices.classList.add('has-error');
      if (group) group.classList.add('has-error');

      const target = group || choices;
      if (target && !target.querySelector('.field-error-message')) {
        const error = document.createElement('div');
        error.className = 'field-error-message';
        error.textContent = message;
        target.appendChild(error);
      }

      return;
    }

    const wrapper = first.closest('.auth-form-group') ||
      first.closest('.city-picker');

    first.classList.add('field-error');
    first.setAttribute('aria-invalid', 'true');

    if (wrapper) {
      wrapper.classList.add('has-error');

      const error = document.createElement('div');
      error.className = 'field-error-message';
      error.textContent = message;
      wrapper.appendChild(error);
    }
  });

  const firstError = form.querySelector('.field-error, .has-error input');
  firstError?.focus({ preventScroll: true });

  firstError?.scrollIntoView({
    behavior: 'smooth',
    block: 'center'
  });
}

  function formatBirthDateInput(input) {
  let digits = input.value.replace(/\D/g, '').slice(0, 8);

  if (digits.length > 4) {
    digits = digits.slice(0, 2) + '/' +
             digits.slice(2, 4) + '/' +
             digits.slice(4);
  } else if (digits.length > 2) {
    digits = digits.slice(0, 2) + '/' +
             digits.slice(2);
  }

  input.value = digits;
}


function collectRegisterStep() {
  const form = document.getElementById('register-form');
  if (!form) return;

  const fd = new FormData(form);

  const getValue = (key) => {
    if (lockedRegisterFields[key]) {
      return registerData[key] ?? '';
    }

    return String(fd.get(key) || '').trim();
  };

  if (registerStep === 1) {
    registerData.email = getValue('email');
    registerData.password = getValue('password');
    registerData.passwordConfirm = getValue('passwordConfirm');
  }

  if (registerStep === 2) {
    registerData.name = getValue('name');
registerData.gender = getValue('gender');
    
    const birthInput = getValue('birthDate');
    const match = birthInput.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);

    registerData.birthDate = match
      ? `${match[3]}-${match[2]}-${match[1]}`
      : birthInput;

    registerData.phone = getValue('phone');
    registerData.city = getValue('city');
  }

  if (registerStep === 3) {
    registerData.occupation = getValue('occupation');
    registerData.status = getValue('status');
    registerData.children = getValue('children');
    registerData.religiousView = getValue('religiousView');
    registerData.height = getValue('height');
    registerData.service = getValue('service');
  }

  
if (registerStep === 4) {
  registerData.relationshipGoal = getValue('relationshipGoal');

  registerData.languages = lockedRegisterFields.languages
    ? registerData.languages
    : fd.getAll('languages').map(String);

  registerData.smoker = getValue('smoker');
  registerData.health = getValue('health');
  registerData.kosher = getValue('kosher');
  registerData.about = getValue('about');
}

}


function validateRegisterStep() {
  const missingFields = [];

  const addMissing = (name, message = 'יש למלא את השדה הזה.') => {
    missingFields.push({ name, message });
  };

  if (registerStep === 1) {
    if (
      !registerData.email ||
      !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(registerData.email)
    ) {
      addMissing('email', 'יש להזין כתובת אימייל תקינה.');
    }
  }

  if (registerStep === 2) {
    if (!registerData.name.trim()) {
      addMissing('name', 'יש להזין את השם שלך.');
    }

    if (!registerData.birthDate) {
      addMissing('birthDate', 'יש להזין תאריך לידה.');
    } else {
      const match = registerData.birthDate.match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );

      if (!match) {
        addMissing('birthDate', 'יש להזין תאריך בפורמט DD/MM/YYYY.');
      } else {
        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);

        const birth = new Date(year, month - 1, day);
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const validDate =
          year >= 1900 &&
          month >= 1 && month <= 12 &&
          day >= 1 && day <= 31 &&
          birth.getFullYear() === year &&
          birth.getMonth() === month - 1 &&
          birth.getDate() === day &&
          birth <= today;

        if (!validDate) {
          addMissing('birthDate', 'יש להזין תאריך לידה תקין.');
        } else {
          let age = today.getFullYear() - year;

          if (
            today.getMonth() < month - 1 ||
            (
              today.getMonth() === month - 1 &&
              today.getDate() < day
            )
          ) {
            age--;
          }

          if (age < 18) {
            addMissing(
              'birthDate',
              'ההרשמה לאתר מיועדת לבני 18 ומעלה.'
            );
          }
        }
      }
    }

    if (!registerData.phone.trim()) {
      addMissing('phone', 'יש להזין מספר טלפון.');
    } else if (
      !/^05\d{8}$/.test(registerData.phone.replace(/\D/g, ''))
    ) {
      addMissing('phone', 'יש להזין מספר נייד ישראלי תקין, למשל 0501234567.');
    }

    if (!registerData.city.trim()) {
      addMissing('city', 'יש לבחור או להזין עיר מגורים.');
    }
  }

  if (registerStep === 3) {
    if (!registerData.occupation?.trim()) {
  addMissing('occupation', 'יש להזין עיסוק.');
}

    if (!registerData.status) {
      addMissing('status');
    }

    if (!registerData.children) {
      addMissing('children', 'יש לבחור תשובה.');
    }

    if (!registerData.religiousView) {
      addMissing('religiousView');
    }

    if (!registerData.height) {
      addMissing('height');
    }

    if (!registerData.service) {
      addMissing('service');
    }
  }

  if (registerStep === 4) {
    if (!registerData.relationshipGoal) {
      addMissing('relationshipGoal', 'יש לבחור את מטרת הקשר.');
    }

      if (
    !Array.isArray(registerData.languages) ||
    registerData.languages.length === 0
  ) {
    addMissing('languages', 'יש לבחור לפחות שפה אחת.');
  }

    if (!registerData.smoker) {
      addMissing('smoker', 'יש לבחור תשובה.');
    }

    if (!registerData.health) {
      addMissing('health', 'יש לבחור תשובה.');
    }

    if (!registerData.kosher) {
      addMissing('kosher', 'יש לבחור תשובה.');
    }
  }

  if (missingFields.length) {
    showRegistrationErrors(missingFields);
    return false;
  }

  clearRegistrationErrors();
  return true;
}


function registerNextStep() {
  collectRegisterStep();
  if (!validateRegisterStep()) return;

  if (registerStep < REGISTER_TOTAL_STEPS) {
    registerStep += 1;
    renderRegister();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  finishRegistration();
}

function registerPrevStep() {
  collectRegisterStep();
  if (registerStep > 1) {
    registerStep -= 1;
    renderRegister();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

async function sendProfileInterest(id) {
  if (!currentUser || !db) {
    alert('צריך להתחבר כדי להביע עניין.');
    return;
  }

  if (String(id) === String(currentUser.id)) {
    alert('אי אפשר להביע עניין בפרופיל של עצמך.');
    return;
  }

  const profile = getProfileById(id);

  if (!profile) {
    alert('לא מצאנו את הפרופיל.');
    return;
  }

  try {
    const { data: existing, error: checkError } = await db
      .from('profile_interests')
      .select('id')
      .eq('sender_id', currentUser.id)
      .eq('receiver_id', profile.id)
      .maybeSingle();

    if (checkError) throw checkError;

    const { data: reciprocal, error: reciprocalError } = await db
      .from('profile_interests')
      .select('id')
      .eq('sender_id', profile.id)
      .eq('receiver_id', currentUser.id)
      .maybeSingle();

    if (reciprocalError) throw reciprocalError;

    if (existing) {
      const { error: deleteError } = await db
        .from('profile_interests')
        .delete()
        .eq('sender_id', currentUser.id)
        .eq('receiver_id', profile.id);

      if (deleteError) throw deleteError;

      const sent = readMatchData('lev_sent_interests', [])
        .filter(item => String(item.profileId) !== String(profile.id));

      saveMatchData('lev_sent_interests', sent);

      alert(
        reciprocal
          ? 'ההתעניינות שלך בוטלה. ההתאמה ההדדית הסתיימה.'
          : 'בקשת ההתעניינות בוטלה.'
      );
    } else {
      const { error: insertError } = await db
        .from('profile_interests')
        .insert({
          sender_id: currentUser.id,
          receiver_id: profile.id
        });

      if (insertError) throw insertError;

      const sent = readMatchData('lev_sent_interests', [])
        .filter(item => String(item.profileId) !== String(profile.id));

      sent.push({
        profileId: profile.id,
        status: 'pending',
        createdAt: new Date().toISOString()
      });

      saveMatchData('lev_sent_interests', sent);

      alert(
        reciprocal
          ? 'יש התאמה הדדית! שניכם מעוניינים זה בזו.'
          : 'בקשת ההתעניינות נשלחה בהצלחה.'
      );
    }

    await openProfileDetail(profile.id);

  } catch (error) {
    console.error('שגיאה בשליחת או בביטול עניין:', error);
    alert('הפעולה נכשלה: ' + (error.message || 'שגיאה לא ידועה'));
  }
}



function readMatchData(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch (error) {
    return fallback;
  }
}

function saveMatchData(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

let swipeStartX = null;
let swipeStartY = null;
let swipePointerElement = null;
let swipePointerId = null;
let swipeCurrentX = 0;
let swipeCurrentY = 0;

function swipePointerDown(event) {
  if (event.pointerType === "mouse" && event.button !== 0) return;

  const element = event.currentTarget;

  swipeStartX = event.clientX;
  swipeStartY = event.clientY;
  swipeCurrentX = 0;
  swipeCurrentY = 0;
  swipePointerElement = element;
  swipePointerId = event.pointerId;

  element.classList.add("dragging");

  try {
    element.setPointerCapture(event.pointerId);
  } catch (error) {}
}

function swipePointerMove(event) {
  const element = event.currentTarget;

  if (
    swipePointerElement !== element ||
    swipeStartX === null
  ) return;

  swipeCurrentX = event.clientX - swipeStartX;
  swipeCurrentY = event.clientY - swipeStartY;

  if (Math.abs(swipeCurrentX) > Math.abs(swipeCurrentY)) {
    element.style.transform =
      `translate(${swipeCurrentX}px, ${swipeCurrentY * 0.25}px) rotate(${swipeCurrentX * 0.045}deg)`;
  }

  const likeStamp = element.querySelector(".swipe-stamp.like");
  const passStamp = element.querySelector(".swipe-stamp.pass");

  if (likeStamp) {
    likeStamp.style.opacity = swipeCurrentX < -20
      ? Math.min(1, Math.abs(swipeCurrentX) / 100)
      : 0;
  }

  if (passStamp) {
    passStamp.style.opacity = swipeCurrentX > 20
      ? Math.min(1, swipeCurrentX / 100)
      : 0;
  }
}
  
function renderCityPicker(

) {
  return `

        <input
          class="city-picker-input ${inputClass}"
          id="${id}"

          autocomplete="off"
          value="${escapeHTML(value)}"
          placeholder="הקלד או בחר עיר"
          ${disabledAttrs}
          onfocus="openCityDropdown('${id}')"
          oninput="filterCityDropdown('${id}')"
          onkeydown="cityDropdownKeydown(event, '${id}')"
          aria-expanded="false"
          aria-controls="${id}-dropdown"
        >
        <span class="city-picker-arrow">▾</span>

      <div
        class="city-picker-dropdown"

        role="listbox"
      ></div>

function getCityPickerMatches(id) {
  const input = document.getElementById(id);
  if (!input) return [];

  const query = input.value.trim();

  return citySuggestions.filter(city =>
    city.includes(query)
  );
}

function openCityDropdown(id) {
  const picker = document.getElementById(id + '-picker');
  const input = document.getElementById(id);

  if (!picker || !input || input.disabled || input.readOnly) return;

  picker.classList.add('open');
  input.setAttribute('aria-expanded', 'true');

  filterCityDropdown(id);
}


function filterCityDropdown(id) {
  const input = document.getElementById(id);
  const dropdown = document.getElementById(id + '-dropdown');
  const picker = document.getElementById(id + '-picker');

  if (!input || !dropdown || !picker) return;

  const matches = getCityPickerMatches(id);
  const currentValue = input.value.trim();

  dropdown.innerHTML =
    matches.map(city => `
      <button
        type="button"
        class="city-picker-option ${
          city === currentValue ? 'selected' : ''
        }"
        role="option"
        aria-selected="${city === currentValue}"
        onmousedown="event.preventDefault()"
        onclick="selectCity('${id}', '${escapeHTML(city).replace(/\\/g, '\\\\').replace(/'/g, "\\'")}')"
      >${escapeHTML(city)}</button>
    `).join('') +

    `
      <button
        type="button"
        class="city-picker-option city-manual-option"
        role="option"
        onmousedown="event.preventDefault()"
        onclick="selectManualCity('${id}')"
      > הקלידו ידנית</button>
    `;

  picker.classList.add('open');
  input.setAttribute('aria-expanded', 'true');
}

function selectManualCity(id) {
  const input = document.getElementById(id);
  const picker = document.getElementById(id + '-picker');

  if (!input || !picker) return;

  input.dataset.manualCity = 'true';

  picker.classList.remove('open');
  input.setAttribute('aria-expanded', 'false');
  input.readOnly = false;
  input.disabled = false;
  input.placeholder = 'הקלד את שם העיר';
  input.focus();
}


function selectCity(id, city) {
  const input = document.getElementById(id);
  const picker = document.getElementById(id + '-picker');

  if (!input || !picker) return;

  input.value = city;
  picker.classList.remove('open');
  input.setAttribute('aria-expanded', 'false');

  input.dispatchEvent(new Event('change', { bubbles: true }));
}

function cityDropdownKeydown(event, id) {
  const picker = document.getElementById(id + '-picker');

  if (event.key === 'Escape') {
    picker?.classList.remove('open');
    event.target.setAttribute('aria-expanded', 'false');
  }

  if (event.key === 'ArrowDown') {
    event.preventDefault();
    openCityDropdown(id);

    const firstOption = picker?.querySelector('.city-picker-option');
    firstOption?.focus();
  }
}

// סגירת הרשימה בלחיצה מחוץ לשדה
document.addEventListener('click', function(event) {
  document.querySelectorAll('.city-picker.open').forEach(picker => {
    if (!picker.contains(event.target)) {
      picker.classList.remove('open');

      const input = picker.querySelector('input');
      input?.setAttribute('aria-expanded', 'false');
    }
  });
});

function swipePointerUp(event) {
  const element = event.currentTarget;

  if (
    swipePointerElement !== element ||
    swipeStartX === null
  ) return;

  const deltaX = event.clientX - swipeStartX;
  const deltaY = event.clientY - swipeStartY;
  const cardType = element.dataset.cardType;
  const profileId = element.dataset.profileId;

  element.classList.remove("dragging");

  const shouldSwipe =
    Math.abs(deltaX) >= 90 &&
    Math.abs(deltaX) > Math.abs(deltaY) * 1.15;

  swipeStartX = null;
  swipeStartY = null;
  swipePointerElement = null;
  swipePointerId = null;
  swipeCurrentX = 0;
  swipeCurrentY = 0;

  if (!shouldSwipe) {
    element.style.transform = "";
    const likeStamp = element.querySelector(".swipe-stamp.like");
    const passStamp = element.querySelector(".swipe-stamp.pass");
    if (likeStamp) likeStamp.style.opacity = 0;
    if (passStamp) passStamp.style.opacity = 0;
    return;
  }

  const direction = deltaX < 0 ? "left" : "right";

  element.classList.add(
    direction === "left" ? "swipe-out-left" : "swipe-out-right"
  );

  if (cardType === "intro") {
    localStorage.setItem("lev_swipe_intro_seen", "yes");
    setTimeout(() => renderSwipe(), 260);
    return;
  }

  if (profileId) {
    setTimeout(() => {
      recordSwipe(
        profileId,
        direction === "left" ? "interested" : "no"
      );
    }, 180);
  }
}

function swipePointerCancel() {
  if (swipePointerElement) {
    swipePointerElement.classList.remove("dragging");
    swipePointerElement.style.transform = "";

    const likeStamp = swipePointerElement.querySelector(".swipe-stamp.like");
    const passStamp = swipePointerElement.querySelector(".swipe-stamp.pass");

    if (likeStamp) likeStamp.style.opacity = 0;
    if (passStamp) passStamp.style.opacity = 0;
  }

  swipeStartX = null;
  swipeStartY = null;
  swipePointerElement = null;
  swipePointerId = null;
  swipeCurrentX = 0;
  swipeCurrentY = 0;
}


async function recordSwipe(profileId, decision) {
  const id = String(profileId);
  const decisions = readMatchData("lev_interest_decisions", []);

  if (decisions.some(item => String(item.profileId) === id)) {
    renderSwipe();
    return;
  }

  // בדיקה שהפרופיל קיים
  const profile = getProfileById(id);

  if (!profile) {
    alert("לא מצאנו את הפרופיל.");
    renderSwipe();
    return;
  }

  // דילוג נשמר כהחלטה מקומית בלבד
  if (decision === "no") {
    decisions.push({
      profileId: id,
      decision: "no",
      date: new Date().toISOString()
    });

    saveMatchData("lev_interest_decisions", decisions);
    renderSwipe();
    return;
  }

  // עניין מחייב משתמש מחובר וחיבור ל-Supabase
  if (!currentUser || !db) {
    alert("צריך להתחבר כדי להביע עניין.");
    renderSwipe();
    return;
  }

  if (String(currentUser.id) === id) {
    renderSwipe();
    return;
  }

  try {
    // בדיקה אם כבר נשלח עניין
    const { data: existing, error: checkError } = await db
      .from("profile_interests")
      .select("id")
      .eq("sender_id", currentUser.id)
      .eq("receiver_id", id)
      .maybeSingle();

    if (checkError) throw checkError;

    // אם אין עניין קיים, שולחים אותו
    if (!existing) {
      const { error: insertError } = await db
        .from("profile_interests")
        .insert({
          sender_id: currentUser.id,
          receiver_id: id
        });

      if (insertError) throw insertError;
    }

    // מעדכנים את רשימת ההתעניינויות המקומית
    const sent = readMatchData("lev_sent_interests", []);
    const alreadySaved = sent.some(
      item => String(item.profileId) === id
    );

    if (!alreadySaved) {
      sent.push({
        profileId: id,
        status: "pending",
        createdAt: new Date().toISOString()
      });

      saveMatchData("lev_sent_interests", sent);
    }

    // שומרים החלטה רק לאחר הצלחה
    decisions.push({
      profileId: id,
      decision: "interested",
      date: new Date().toISOString()
    });

    saveMatchData("lev_interest_decisions", decisions);
  } catch (error) {
    console.error("שגיאה בשליחת התעניינות מהסוויפ:", error);
    alert("לא הצלחנו לשלוח את ההתעניינות. אפשר לנסות שוב.");
  }

  renderSwipe();
}

function getOccupationMatches(id) {
  const input = document.getElementById(id);
  if (!input) return [];

  const query = input.value.trim();

  if (!query) return occupationSuggestions.slice(0, 12);

  return occupationSuggestions.filter(item =>
    item.includes(query)
  ).slice(0, 12);
}

function renderOccupationPicker(
  id,
  name,
  value = '',
  inputClass = '',
  disabledAttrs = ''
) {
  return `
    <div class="city-picker occupation-picker" id="${id}-picker">
      <div class="city-picker-input-wrap">
        <input
          class="city-picker-input ${inputClass}"
          id="${id}"
          name="${name}"
          type="text"
          autocomplete="off"
          value="${escapeHTML(value)}"
          placeholder="הקלד/י תחום עיסוק"
          ${disabledAttrs}
          onfocus="openOccupationDropdown('${id}')"
          oninput="filterOccupationDropdown('${id}')"
          onkeydown="occupationDropdownKeydown(event, '${id}')"
          aria-expanded="false"
          aria-controls="${id}-dropdown"
        >
        <span class="city-picker-arrow">▾</span>
      </div>

      <div
        class="city-picker-dropdown"
        id="${id}-dropdown"
        role="listbox"
      ></div>
    </div>
  `;
}

function openOccupationDropdown(id) {
  const picker = document.getElementById(id + '-picker');
  const input = document.getElementById(id);

  if (!picker || !input || input.disabled || input.readOnly) return;

  picker.classList.add('open');
  input.setAttribute('aria-expanded', 'true');
  filterOccupationDropdown(id);
}

function filterOccupationDropdown(id) {
  const input = document.getElementById(id);
  const dropdown = document.getElementById(id + '-dropdown');
  const picker = document.getElementById(id + '-picker');

  if (!input || !dropdown || !picker) return;

  const matches = getOccupationMatches(id);
  const currentValue = input.value.trim();

  dropdown.innerHTML =
    matches.map(item => `
      <button
        type="button"
        class="city-picker-option ${
          item === currentValue ? 'selected' : ''
        }"
        role="option"
        aria-selected="${item === currentValue}"
        onmousedown="event.preventDefault()"
        onclick="selectOccupation('${id}', '${escapeHTML(item).replace(/\\/g, '\\\\').replace(/'/g, "\\'")}')"
      >${escapeHTML(item)}</button>
    `).join('') +
    `
      <button
        type="button"
        class="city-picker-option city-manual-option"
        role="option"
        onmousedown="event.preventDefault()"
        onclick="selectManualOccupation('${id}')"
      >השארת הטקסט שהוקלד</button>
    `;

  picker.classList.add('open');
  input.setAttribute('aria-expanded', 'true');
}

function selectOccupation(id, occupation) {
  const input = document.getElementById(id);
  const picker = document.getElementById(id + '-picker');

  if (!input || !picker) return;

  input.value = occupation;
  picker.classList.remove('open');
  input.setAttribute('aria-expanded', 'false');
  input.dispatchEvent(new Event('change', { bubbles: true }));
}

function selectManualOccupation(id) {
  const input = document.getElementById(id);
  const picker = document.getElementById(id + '-picker');

  if (!input || !picker) return;

  picker.classList.remove('open');
  input.setAttribute('aria-expanded', 'false');
  input.focus();
}

function occupationDropdownKeydown(event, id) {
  const picker = document.getElementById(id + '-picker');

  if (event.key === 'Escape') {
    picker?.classList.remove('open');
    event.target.setAttribute('aria-expanded', 'false');
  }

  if (event.key === 'ArrowDown') {
    event.preventDefault();
    openOccupationDropdown(id);

    picker?.querySelector('.city-picker-option')?.focus();
  }
}

async function loadPersonalDetailsFromSupabase() {
  if (!currentUser) {
    throw new Error('אין משתמש מחובר');
  }

  const { data: profile, error } = await db
    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .single();

  if (error) {
    console.error('שגיאה בטעינת הפרטים האישיים:', error);
    alert('לא הצלחנו לטעון את הפרטים: ' + error.message);
    return false;
  }

  const details = {
    ...personalDefaultDetails,
    name: profile.name || '',
    phone: profile.phone || '',
    email: profile.email || currentUser.email || '',
    birthDate: profile.birth_date || '',
    city: profile.city || '',
    occupation: profile.occupation || '',
    status: profile.status || '',
    children: profile.children || '',
    religiousView: profile.religious_view || '',
    height: profile.height || '',
    relationshipGoal: profile.relationship_goal || '',
    service: profile.service || '',
    languages: Array.isArray(profile.languages)
      ? profile.languages
      : [],
    smoker: profile.smoker || '',
    health: profile.health || '',
    kosher: profile.kosher || '',
    about: profile.about || ''
  };

  details.age = calculateAge(details.birthDate);

  // טעינת הגדרות הפרטיות שנשמרו ב-Supabase
  const savedPrivacy = profile.privacy &&
    typeof profile.privacy === 'object' &&
    !Array.isArray(profile.privacy)
      ? profile.privacy
      : {};

  const privacy = {};

  Object.keys(personalFieldLabels).forEach(key => {
    const value = savedPrivacy[key];

    privacy[key] = ['public', 'matched', 'private'].includes(value)
      ? value
      : 'public';
  });

  // שמירה מקומית לצורך שימוש במסך ההגדרות
  saveMatchData(PERSONAL_PRIVACY_KEY, privacy);

  localStorage.setItem(
    PERSONAL_PRIVACY_MODE_KEY,
    savedPrivacy._fullPrivacyMode === true ? 'yes' : 'no'
  );

  savePersonalDetails(details);

  return true;
}


function getPersonalDetails() {
  const saved = readMatchData(PERSONAL_KEY, {});

  const details = {
    ...personalDefaultDetails,
    ...saved
  };

  details.age = calculateAge(details.birthDate);

  if (!Array.isArray(details.languages)) {
    details.languages = details.languages
      ? String(details.languages)
          .split(',')
          .map(x => x.trim())
          .filter(Boolean)
      : [];
  }

  return details;
}


function savePersonalDetails(details) {
  saveMatchData(PERSONAL_KEY, details);
}


function getPersonalPrivacy() {
  const saved = readMatchData(PERSONAL_PRIVACY_KEY, {});
  const privacy = {};

  Object.keys(personalFieldLabels).forEach(key => {
    privacy[key] = ['public', 'matched', 'private'].includes(saved[key])
      ? saved[key]
      : 'public';
  });

  return privacy;
}

async function savePersonalPrivacy(privacy) {
  saveMatchData(PERSONAL_PRIVACY_KEY, privacy);

  if (!currentUser) return false;

  const { error } = await db
    .from('profiles')
    .update({
      privacy: {
        ...privacy,
        _fullPrivacyMode: isFullPrivacyMode()
      }
    })
    .eq('id', currentUser.id);

  if (error) {
    console.error('שגיאה בשמירת הגדרות הפרטיות:', error);
    alert('הגדרות הפרטיות לא נשמרו בשרת: ' + error.message);
    return false;
  }

  return true;
}

function updatePersonalPrivacy(key, value) {
  if (!Object.prototype.hasOwnProperty.call(personalFieldLabels, key)) return;
  if (!['public', 'matched', 'private'].includes(value)) return;

  const privacy = getPersonalPrivacy();
  privacy[key] = value;

  savePersonalPrivacy(privacy).then(success => {
    if (success) renderPersonal();
  });
}

function isFullPrivacyMode() {
  return localStorage.getItem(PERSONAL_PRIVACY_MODE_KEY) === 'yes';
}

async function toggleFullPrivacyMode() {
  const enable = !isFullPrivacyMode();

  localStorage.setItem(PERSONAL_PRIVACY_MODE_KEY, enable ? 'yes' : 'no');

  const privacy = getPersonalPrivacy();

  if (enable) {
    Object.keys(personalFieldLabels).forEach(key => {
      privacy[key] = key === 'name' || key === 'about'
        ? 'public'
        : 'matched';
    });
  }

  const success = await savePersonalPrivacy(privacy);

  renderPersonal();

  if (!success) {
    alert('שינוי מצב הפרטיות לא נשמר בשרת. בדוק את החיבור ואת הרשאות Supabase.');
  }
}

  
  function calculateAge(birthDate) {
  if (!birthDate) return '';

  const birth = new Date(birthDate + 'T00:00:00');
  const today = new Date();

  if (
    Number.isNaN(birth.getTime()) ||
    birth > today ||
    birth.getFullYear() < 1900
  ) {
    return '';
  }

  let age = today.getFullYear() - birth.getFullYear();

  const birthdayNotReached =
    today.getMonth() < birth.getMonth() ||
    (
      today.getMonth() === birth.getMonth() &&
      today.getDate() < birth.getDate()
    );

  if (birthdayNotReached) age--;

  return age;
}

let selectedProfilePhotos = [];

function previewProfilePhotos(input) {
  const files = Array.from(input.files || []);
  const preview = document.getElementById('profile-photo-previews');

  if (!preview) return;

  const allowedTypes = [
    'image/jpeg',
    'image/png',
    'image/webp'
  ];

  const validFiles = files.filter(file =>
    allowedTypes.includes(file.type) &&
    file.size <= 5 * 1024 * 1024
  );

  if (validFiles.length !== files.length) {
    alert('אפשר לבחור תמונות JPG, PNG או WebP עד 5MB לתמונה.');
  }

  if (validFiles.length > 3) {
    alert('אפשר להעלות עד 3 תמונות בלבד.');
  }

  selectedProfilePhotos = validFiles.slice(0, 3);

  preview.innerHTML = selectedProfilePhotos.map((file, index) => {
    const url = URL.createObjectURL(file);

    return `
      <div class="profile-photo-preview">
        <img
          src="${url}"
          alt="תצוגה מקדימה של תמונה ${index + 1}"
        >
        <button
          type="button"
          class="profile-photo-remove"
          aria-label="הסרת תמונה ${index + 1}"
          onclick="removeProfilePhoto(${index})"
        >×</button>
      </div>
    `;
  }).join('');

  input.value = '';
}

function removeProfilePhoto(index) {
  selectedProfilePhotos.splice(index, 1);

  const input = document.getElementById('reg-profile-photos');

  if (input) {
    const transfer = new DataTransfer();

    selectedProfilePhotos.forEach(file => transfer.items.add(file));
    input.files = transfer.files;
    previewProfilePhotos(input);
  } else {
    const preview = document.getElementById('profile-photo-previews');
    if (preview) preview.innerHTML = '';
  }
}


async function uploadProfilePhotos() {
  if (!selectedProfilePhotos.length) return [];

  const { data: { session }, error } = await db.auth.getSession();

  if (error || !session?.access_token) {
    throw new Error('צריך להתחבר מחדש כדי להעלות תמונות.');
  }

  const uploadedKeys = [];

  for (const file of selectedProfilePhotos) {
    const response = await fetch('WORKER_URL_HERE', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${session.access_token}`,
        'Content-Type': file.type
      },
      body: file
    });

    const result = await response.json();

    if (!response.ok || !result.success || !result.key) {
      throw new Error(result.error || 'העלאת תמונה נכשלה.');
    }

    uploadedKeys.push(result.key);
  }

  return uploadedKeys;
}

async function saveAllPersonalDetails() {
  const form = document.getElementById('personal-details-form');
  if (!form || !currentUser) return;

  const formData = new FormData(form);
  const details = getPersonalDetails();

  const textFields = [
    'city',
    'occupation',
    'status',
    'children',
    'religiousView',
    'height',
    'relationshipGoal',
    'service',
    'smoker',
    'health',
    'kosher'
  ];

  textFields.forEach(key => {
    details[key] = String(formData.get(key) || '').trim();
  });

  details.languages = formData.getAll('languages')
    .map(value => String(value).trim())
    .filter(Boolean);

  const profileUpdate = {
    city: details.city || null,
    occupation: details.occupation || null,
    status: details.status || null,
    children: details.children || null,
    religious_view: details.religiousView || null,
    height: details.height || null,
    relationship_goal: details.relationshipGoal || null,
    service: details.service || null,
    languages: details.languages,
    smoker: details.smoker || null,
    health: details.health || null,
    kosher: details.kosher || null
  };

  const { error } = await db
    .from('profiles')
    .update(profileUpdate)
    .eq('id', currentUser.id);

  if (error) {
    console.error('שגיאה בשמירת הפרטים:', error);
    alert('לא הצלחנו לשמור את הפרטים: ' + error.message);
    return;
  }

  savePersonalDetails(details);
  renderPersonal();

  alert('הפרטים נשמרו בהצלחה.');
}

async function updateNotificationCount() {
  const badge = document.getElementById('notification-count');
  if (!badge) return;

  try {
    const { data: authData, error: authError } =
      await db.auth.getUser();

    if (authError) throw authError;

    const user = authData?.user;

    if (!user) {
      badge.textContent = '0';
      return;
    }

    const { data: interests, error: interestsError } = await db
      .from('profile_interests')
      .select('id, sender_id')
      .eq('receiver_id', user.id);

    if (interestsError) throw interestsError;

    const { data: receipts, error: receiptsError } = await db
      .from('interest_notifications_read')
      .select('interest_id')
      .eq('user_id', user.id);

    if (receiptsError) throw receiptsError;

    const readIds = new Set(
      (receipts || []).map(item => String(item.interest_id))
    );

    const unreadSenders = new Set(
      (interests || [])
        .filter(item =>
          item.sender_id &&
          item.sender_id !== user.id &&
          !readIds.has(String(item.id))
        )
        .map(item => String(item.sender_id))
    );

    badge.textContent = String(unreadSenders.size);
  } catch (error) {
    console.error('שגיאה בעדכון מונה ההתראות:', error);
  }
}


function updatePersonalPrivacy(key, value) {
  if (!Object.prototype.hasOwnProperty.call(personalFieldLabels, key)) return;
  if (!['public', 'matched', 'private'].includes(value)) return;

  const privacy = getPersonalPrivacy();
  privacy[key] = value;
  savePersonalPrivacy(privacy);

  renderPersonal();
} 

async function renderNotifications() {

  try {

      await db.auth.getUser();

    if (authError) throw authError;

    const user = authData?.user;

    if (!user) {

        <div class="notifications-empty">

    const { data: interests, error: interestsError } = await db
      .from('profile_interests')
      .select('id, sender_id, created_at')
      .eq('receiver_id', user.id);

    if (interestsError) throw interestsError;

    const { data: readReceipts, error: readError } = await db
      .from('interest_notifications_read')
      .select('interest_id')
      .eq('user_id', user.id);

    if (readError) throw readError;

    const readIds = new Set(
      (readReceipts || []).map(item => String(item.interest_id))
    );

    const unreadInterests = (interests || [])
      .filter(item =>
        item.sender_id &&
        item.sender_id !== user.id &&
        !readIds.has(String(item.id))
      )
      .sort((a, b) =>
        new Date(b.created_at) - new Date(a.created_at)
      );

    // שומרים את בקשת ההתעניינות האחרונה שטרם נקראה
    // מכל שולח, יחד עם ה-ID שלה לצורך סימון הקריאה.
    const notificationInterestBySender = new Map();

    unreadInterests.forEach(item => {
      const senderId = String(item.sender_id);

      if (!notificationInterestBySender.has(senderId)) {
        notificationInterestBySender.set(senderId, item);
      }
    });

    const senderIds = [...notificationInterestBySender.keys()];

    if (!senderIds.length) {
      list.innerHTML = `
        <div class="notifications-empty">
          <div class="notifications-empty-icon">
            <svg viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
            </svg>
          </div>
          <h3>אין התראות חדשות</h3>
          <p>כשמישהו או מישהי יתעניינו בך, הבקשה תופיע כאן.</p>
        </div>
      `;
      return;
    }

const { data: profiles, error: profilesError } = await db
  .from('profiles')
  .select('*')
  .in('id', senderIds);

if (profilesError) throw profilesError;

    if (profilesError) throw profilesError;

    const profileMap = new Map(
      (profiles || []).map(profile => [String(profile.id), profile])
    );

    const senders = senderIds
      .map(id => profileMap.get(String(id)))
      .filter(Boolean);

    if (!senders.length) {
      list.innerHTML = `
        <div class="notifications-empty">
          לא ניתן לטעון את פרטי השולחים כרגע.
        </div>
      `;
      return;
    }


list.innerHTML = senders.map(profile => {
  const name = getProfileName(profile) || 'משתמש/ת';
  const gender = String(profile.gender || '').toLowerCase();

  const isFemale = [
    'female', 'woman', 'נקבה', 'אישה', 'female_user'
  ].includes(gender);

  const message = isFemale
    ? `${name} מעוניינת לדעת עליך יותר`
    : `${name} מעוניין לדעת עליך יותר`;

      const photo = getProfileImage(profile);

      return `
        <article
          class="notification-item interest-notification"
          role="button"
          tabindex="0"
          data-profile-id="${escapeHTML(String(profile.id))}"
          data-interest-id="${escapeHTML(
  String(notificationInterestBySender.get(String(profile.id))?.id || '')
)}"
          aria-label="${escapeHTML(message)}">

          <div class="notification-profile-photo">
            ${
              photo
                ? `<img src="${escapeHTML(photo)}"
                    alt=""
                    loading="lazy">`
                : `<svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21a8 8 0 0 1 16 0"/>
                  </svg>`
            }
          </div>

          <div class="notification-item-content">
            <div class="notification-item-top">
              <span class="notification-item-title">
                ${escapeHTML(name)}
              </span>
              <span class="notification-item-label">
                בקשת התעניינות
              </span>
            </div>

            <p class="notification-item-message">
              ${escapeHTML(message)}
            </p>

            <div class="notification-item-date">
              לצפייה בפרופיל ולהמשך התהליך
            </div>
          </div>

          <div class="notification-open-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 18 6-6-6-6"/>
            </svg>
          </div>
        </article>
      `;
    }).join('');

    
    // פתיחת פרופיל וסימון ההתראה כנקראה ב-Supabase
    list.querySelectorAll('.interest-notification').forEach(item => {
      const openProfile = async () => {
        const profileId = item.dataset.profileId;
        const interestId = item.dataset.interestId;

        if (!profileId || !interestId) return;

        try {
          const { error } = await db
            .from('interest_notifications_read')
            .upsert(
              {
                user_id: user.id,
                interest_id: interestId
              },
              {
                onConflict: 'user_id,interest_id',
                ignoreDuplicates: true
              }
            );

          if (error) throw error;

          await openProfileDetail(profileId);
        } catch (error) {
          console.error('שגיאה בסימון ההתראה כנקראה:', error);
          alert('לא הצלחנו לשמור את קריאת ההתראה. נסה שוב.');
        }
      };

      item.addEventListener('click', openProfile);

      item.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openProfile();
        }
      });
    });


  } catch (error) {
    console.error('שגיאה בטעינת התראות:', error);

    list.innerHTML = `
      <div class="notifications-empty">
        <h3>לא הצלחנו לטעון את ההתראות</h3>
        <p>בדוק את החיבור ואת הרשאות הגישה לנתונים.</p>
        <button type="button"
          class="notifications-retry"
          onclick="renderNotifications()">
          ניסיון חוזר
        </button>
      </div>
    `;
  }

  await updateNotificationCount();
}


  
  
function showPage(page) {
  const content = document.getElementById('app-content');
  document.body.classList.remove('registration-mode');
  if (!content) {
    console.error('לא נמצא האלמנט app-content');
    return;
  }

  // אם המשתמש עדיין לא מחובר, לא מציגים את תוכן האתר
  // showPage לא מאפשר גישה למי שלא עבר אימות.
// בדיקה זו מסתמכת על המשתמש שכבר אומת ונבדק באתחול.
if (!currentUser) {
  renderLogin();
  return;
}

  // הסרת מצבי התחברות והרשמה
  document.body.classList.remove('auth-only');
  document.body.classList.remove('registration-mode');

  // עדכון הסרגל התחתון
  document.querySelectorAll('.bottom-item').forEach(item => {
    item.classList.remove('active');
  });

  const navItems = {
    swipe: 0,
    profiles: 1,
    favorites: 2,
    personal: 3
  };

  if (Object.prototype.hasOwnProperty.call(navItems, page)) {
    const items = document.querySelectorAll('.bottom-item');
    items[navItems[page]]?.classList.add('active');
  }

  // הצגת המסך המבוקש
  switch (page) {
    case 'home':
    case 'swipe':
      renderSwipe();
      break;

    case 'profiles':
      renderProfiles();
      break;

    case 'favorites':
      renderFavorites();
      break;

    case 'my-interests':
      renderMyInterests();
      break;

    case 'personal':
  loadPersonalDetailsFromSupabase().then(success => {
    if (success) {
      renderPersonal();
    }
  });
  break;
    case 'notifications':
      renderNotifications();
      break;

    default:
      console.warn('מסך לא מוכר:', page);
      renderSwipe();
  }

  window.scrollTo({ top: 0, behavior: 'auto' });
  updateNotificationCount();
}

async function initApp() {
  try {
    if (!db || !db.auth) {
      throw new Error('קליינט Supabase לא אותחל');
    }

    console.log('מתחילים בדיקת session...');

    const { data, error } = await db.auth.getSession();

    if (error) {
      console.error('שגיאה בקריאת session:', error);
      renderLogin();
      return;
    }

    const session = data?.session;

    if (!session?.user) {
      console.warn('לא נמצא session בדפדפן');
      renderLogin();
      return;
    }

    console.log('נמצא session:', session.user.id);
    console.log('אימייל:', session.user.email);

    await afterAuthSuccess(session.user);
  } catch (err) {
    console.error('שגיאת אתחול:', err);
    renderLogin();
  }
}
